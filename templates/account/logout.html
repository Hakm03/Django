{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Cerrar sesión" %}{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 2rem;">
    <div class="erp-card">
        <div class="erp-card-header">{% trans "Cerrar sesión" %}</div>
        <p>{% trans '¿Estás seguro de que quieres cerrar sesión?' %}</p>
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn-erp-danger">{% trans 'Cerrar sesión' %}</button>
            <a href="{% url 'inicio' %}" class="btn-erp-primary">{% trans 'Cancelar' %}</a>
        </form>
    </div>
</div>
{% endblock %}
