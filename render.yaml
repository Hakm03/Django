# render.yaml
# Documentación: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: erp-django-utec
    env: python
    plan: free                     # plan gratuito para desarrollo académico
    region: oregon                 # us-west región gratuita de Render
    branch: main
    buildCommand: |
      pip install -r requirements.txt && python manage.py collectstatic 
      --no-input && python manage.py migrate && python manage.py createsuperuser 
      --noinput || true
    startCommand: gunicorn core.wsgi --workers 2 --timeout 120 --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: SECRET_KEY
        generateValue: true        # Render genera una clave aleatoria segura
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Stripe (W14+) — sync:false = Render NO guarda el valor en este archivo;
      # te lo pedirá en el panel la primera vez (o lo agregas en Environment).
      # Nota: este servicio se configuró a mano en Render y NO usa render.yaml,
      # pero se documenta aquí por si algún día se usa Infrastructure as Code.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET      # se usa a partir de W15
        sync: false
      # W16: Celery + Redis (Key Value de Render, creado a mano en el panel).
      # No se declara un "keyvalue" aquí: Render crearía una segunda instancia.
      - key: REDIS_URL                  # Internal Key Value URL (redis://red-...:6379)
        sync: false
      - key: CELERY_EMBEDDED_WORKER     # 1 = worker de Celery dentro del contenedor web
        value: "1"

databases:
  - name: erp-django-db
    databaseName: erp_db
    user: erp_user
    plan: free                     # PostgreSQL gratuito en Render (90 días)
    region: oregon
