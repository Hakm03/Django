# docker-compose.yml — ERP en tu PC: base de datos + aplicación
# Uso:  docker compose up --build
# Las contraseñas de este archivo son SOLO de práctica local; nunca van en Render.
services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       erp_db
      POSTGRES_USER:     erp_user
      POSTGRES_PASSWORD: erp_pass_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis — broker de Celery (W16) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"          # solo accesible desde este equipo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    restart: unless-stopped
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL:                  redis://redis:6379/0
      CELERY_EMBEDDED_WORKER:     "0"   # aquí el worker es el servicio celery_worker
      DJANGO_SETTINGS_MODULE:     core.settings_prod
      MODO_LOCAL:                 "True"
      SECRET_KEY:                 dev-clave-docker-no-usar-en-produccion
      DATABASE_URL:               postgres://erp_user:erp_pass_local@db:5432/erp_db
      ALLOWED_HOSTS:              localhost,127.0.0.1
      DJANGO_SUPERUSER_USERNAME:  admin
      DJANGO_SUPERUSER_EMAIL:     admin@erp.local
      DJANGO_SUPERUSER_PASSWORD:  admin-local-123
      # Stripe (W14+) — ${VAR} toma el valor de TU .env local (docker compose
      # lo lee automáticamente porque está junto a este archivo). Así nunca
      # queda una clave real escrita aquí. Si tu .env no las tiene, quedan
      # vacías y el checkout muestra "no disponible" (sin romper el resto).
      STRIPE_SECRET_KEY:          ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY:     ${STRIPE_PUBLISHABLE_KEY:-}

  # ── Worker de Celery (W16) ───────────────────────────────────────────
  celery_worker:
    build: .
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]   # exec "$@" ejecuta el command
    command: celery -A core worker -l info -Q erp_django
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      MODO_LOCAL:             "True"
      SECRET_KEY:             dev-clave-docker-no-usar-en-produccion
      DATABASE_URL:           postgres://erp_user:erp_pass_local@db:5432/erp_db
      ALLOWED_HOSTS:          localhost,127.0.0.1
      REDIS_URL:              redis://redis:6379/0

  # ── Flower — monitor de Celery (W16) → http://localhost:5555 ─────────
  flower:
    build: .
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: celery -A core flower --port=5555
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"          # solo accesible desde este equipo
    depends_on:
      - redis
      - celery_worker
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      MODO_LOCAL:             "True"
      SECRET_KEY:             dev-clave-docker-no-usar-en-produccion
      DATABASE_URL:           postgres://erp_user:erp_pass_local@db:5432/erp_db
      ALLOWED_HOSTS:          localhost,127.0.0.1
      REDIS_URL:              redis://redis:6379/0

volumes:
  postgres_data:
  static_volume:
  media_volume:
